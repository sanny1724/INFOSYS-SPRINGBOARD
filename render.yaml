services:
  - type: web
    name: ecoeye-ai
    env: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URL
        sync: false
      - key: FRONTEND_URL
        value: "https://your-app-name.onrender.com"
      - key: BACKEND_URL
        value: "https://your-app-name.onrender.com"
      - key: GOOGLE_REDIRECT_URI
        value: "https://your-app-name.onrender.com/callback/google"
      - key: GITHUB_REDIRECT_URI
        value: "https://your-app-name.onrender.com/callback/github"
